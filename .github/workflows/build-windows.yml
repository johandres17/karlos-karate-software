name: Build Windows Executable

on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      edicion:
        description: "Qué edición se empaqueta"
        type: choice
        options: [karate]
        default: karate

permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # La MISMA version que compila el Mac congelado.
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.21.0

      - name: Qué edición se empaqueta
        id: ed
        shell: pwsh
        run: |
          # Sin entrada (release o etiqueta) es la de siempre: el karate.
          $ed = "${{ github.event.inputs.edicion }}"
          if (-not $ed) { $ed = "karate" }
          python scripts/edicion_info.py $ed windows | Tee-Object -Variable datos
          $datos | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Regenerate build info
        run: python scripts/generate_build_info.py

      - name: Build executable with PyInstaller (onedir, evita falsos positivos de antivirus)
        run: |
          cd src
          pyinstaller ${{ steps.ed.outputs.spec }} --noconfirm

      - name: Smoke test bundled exe (full import chain)
        shell: pwsh
        run: |
          $env:KARLOS_SMOKE_TEST = "1"
          $exe = "src/dist/${{ steps.ed.outputs.nombre }}/${{ steps.ed.outputs.nombre }}.exe"
          $p = Start-Process -FilePath $exe -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Error "Smoke test TIMED OUT (import likely crashed with a dialog)"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "Smoke test FAILED: exit code $($p.ExitCode)"; exit 1 }
          Write-Host "SMOKE OK"

      - name: Diagnostico completo dentro del ejecutable
        shell: pwsh
        run: |
          # Un clip H.264 real: es el codec de los videos del estudio, y
          # decodificarlo dentro del .exe prueba la DLL de ffmpeg de cv2.
          # El runner no trae ffmpeg: se instala, y si aun asi falta, el
          # chequeo del video externo se salta solo (avisa, no tumba).
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress | Out-Null
            $env:PATH = "$env:PATH;$env:ChocolateyInstall\bin"
          }
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
            ffmpeg -y -f lavfi -i "testsrc=duration=2:size=320x240:rate=10" -c:v libx264 -pix_fmt yuv420p muestra_h264.mp4 2>$null
            if (Test-Path muestra_h264.mp4) { $env:KARLOS_DIAG_VIDEO = "$PWD/muestra_h264.mp4" }
          } else {
            Write-Warning "sin ffmpeg: el chequeo H.264 se salta"
          }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:KARLOS_DIAG_FILE = "$PWD/diagnostico.txt"
          $exe = "src/dist/${{ steps.ed.outputs.nombre }}/${{ steps.ed.outputs.nombre }}.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--diagnostico" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Error "Diagnostico COLGADO en Windows"; exit 1 }
          if (Test-Path diagnostico.txt) { Get-Content diagnostico.txt | Write-Host }
          if ($p.ExitCode -ne 0) { Write-Error "Diagnostico FALLO en Windows (exit $($p.ExitCode))"; exit 1 }
          Write-Host "DIAGNOSTICO OK"

      - name: Package as ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "src/dist/${{ steps.ed.outputs.nombre }}/*" `
            -DestinationPath "${{ steps.ed.outputs.zip }}"

      - name: Guardar el ZIP (lanzamiento a mano)
        # Sin esto, una compilación lanzada a mano no deja nada que bajar:
        # construía, comprobaba y tiraba el resultado.
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ed.outputs.edicion }}-windows
          path: ${{ steps.ed.outputs.zip }}
          retention-days: 14

      - name: Upload to Release
        # Solo con una release o una etiqueta: lanzado a mano desde una rama
        # compila y comprueba, pero no publica nada.
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '*-Windows-v*.zip'
