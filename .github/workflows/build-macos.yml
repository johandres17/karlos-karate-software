name: Build macOS DMG

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-macos:
    runs-on: macos-14  # Apple Silicon runner → arm64 build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Regenerate build info and read version
        id: meta
        run: |
          python scripts/generate_build_info.py
          # La versión es la de la edición que se empaqueta (decisión 0006).
          VERSION=$(cd src && python -c "from karlos_ediciones.karate import EDICION; print(EDICION.version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build .app with PyInstaller
        run: |
          cd src
          pyinstaller karlos_karate_macos.spec --noconfirm

      - name: Smoke test bundled app (full import chain)
        run: |
          KARLOS_SMOKE_TEST=1 "src/dist/Karlos Karate.app/Contents/MacOS/Karlos Karate"

      - name: Package DMG with unlock guide
        run: |
          STAGE=dmg_stage
          mkdir -p "$STAGE"
          cp -R "src/dist/Karlos Karate.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          python scripts/make_dmg_guide.py "$STAGE"
          hdiutil create -volname "Karlos Karate v${{ steps.meta.outputs.version }}" \
            -srcfolder "$STAGE" -ov -format UDZO \
            "KarlosKarate-macOS-v${{ steps.meta.outputs.version }}-AppleSilicon.dmg"

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: KarlosKarate-macOS-v*.dmg
